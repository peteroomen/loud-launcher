name: Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Use shared debug key
        if: env.DEBUG_KEYSTORE != ''
        run: |
          echo "$DEBUG_KEYSTORE" | base64 -d > "$RUNNER_TEMP/debug.keystore"
          echo "DEBUG_KEYSTORE_FILE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug
      - name: Check stable signing identity
        if: env.DEBUG_KEYSTORE != ''
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | tee certs.txt
          grep -qi "SHA-256 digest: 5b6973b159eafc40f5509ae8f4dcf0125a66110236303319ee7f6c73778deae1" certs.txt
      - run: cp app/build/outputs/apk/debug/app-debug.apk loud-0.1.${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: loud-preview
          path: loud-*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: app/build/reports
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.DEBUG_KEYSTORE != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Loud preview 0.1.${{ github.run_number }}
          body: Phase 1 design review. Sample data only; not registered as HOME yet.
          files: loud-0.1.${{ github.run_number }}.apk
