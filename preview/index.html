#loud-design .loud-stage{padding:18px 8px 28px;min-height:1480px;box-sizing:border-box}
#loud-design .phone{--paper:#f5f0e5;--ink:#171714;--yellow:#ffe600;--cyan:#00cbe5;--pink:#ff6395;--soft:#fffdf6;--line:#171714;--round:0px;--border:3px;--shadow:5px;max-width:408px;margin:auto;background:var(--paper);color:var(--canvasink,var(--ink));font-family:'Space Grotesk',sans-serif;padding:16px 16px 22px;box-sizing:border-box; border:2px solid var(--line);border-radius:30px;overflow:clip;box-shadow:7px 8px 0 var(--line)}
#loud-design .phone.round{--round:19px;--border:2px;--shadow:4px}
#loud-design .phone *{box-sizing:border-box}
#loud-design button,#loud-design select,#loud-design input,#loud-design textarea{font:inherit;color:inherit}
#loud-design button,#loud-design select{cursor:pointer}
#loud-design button{min-height:48px;touch-action:manipulation}
#loud-design .status{display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin:0 6px 20px}
#loud-design .top{display:flex;justify-content:space-between;align-items:center;margin:0 2px 15px}
#loud-design .brand{font:800 33px/1 'Barlow Condensed',sans-serif;letter-spacing:-1px}
#loud-design .sample{font:10px 'Space Mono',monospace;letter-spacing:1px}
#loud-design .smallbtn{color:var(--ink);background:var(--soft);border:var(--border) solid var(--line);border-radius:var(--round);padding:8px 12px;box-shadow:3px 3px 0 var(--line);font-size:12px;font-weight:700}
#loud-design .tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
#loud-design .tile{color:var(--ink);grid-column:span 4;background:var(--soft);border:var(--border) solid var(--line);border-radius:var(--round);box-shadow:var(--shadow) var(--shadow) 0 var(--line);padding:15px;min-width:0;position:relative;overflow:hidden}
#loud-design .half{grid-column:span 2}
#loud-design .yellow{background:var(--yellow)}#loud-design .cyan{background:var(--cyan)}#loud-design .pink{background:var(--pink)}
#loud-design .eyebrow{display:flex;align-items:center;justify-content:space-between;gap:8px;font:700 11px 'Space Mono',monospace;letter-spacing:.4px;margin-bottom:12px}
#loud-design .tag{display:inline-block;border:2px solid var(--line);background:var(--soft);padding:4px 7px;font:700 11px 'Space Mono',monospace;max-width:100%}
#loud-design .clock{font:800 clamp(64px,19vw,92px)/.94 'Barlow Condensed',sans-serif;letter-spacing:-2px;margin:12px 0}
#loud-design .round .clock{font-family:'Space Grotesk',sans-serif;font-size:clamp(54px,16vw,74px);letter-spacing:-5px;margin:20px 0}
#loud-design .round .clocktile{background:var(--soft)}
#loud-design .round .clocktile .tag{background:var(--yellow);border:0;transform:rotate(-3deg);padding:5px 12px}
#loud-design .date{font-size:13px;font-weight:700}
#loud-design .clockfoot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font:10px 'Space Mono',monospace}
#loud-design .weatherbig{display:flex;justify-content:space-between;align-items:center;font:700 43px 'Space Grotesk',sans-serif;letter-spacing:-2px;margin:8px 0}
#loud-design .weatherbig i{width:28px;height:28px}
#loud-design .sub{font-size:12px;line-height:1.5}
#loud-design .note{font-size:18px;line-height:1.3;font-weight:600;min-height:62px}
#loud-design .music{display:grid;grid-template-columns:65px 1fr;gap:14px;align-items:center}
#loud-design .record{height:65px;border:2px solid var(--line);background:repeating-radial-gradient(circle at center,var(--ink) 0 5px,var(--soft) 6px 7px,var(--ink) 8px 10px);border-radius:50%;position:relative}
#loud-design .record:after{content:'';position:absolute;inset:23px;background:var(--pink);border-radius:50%;border:2px solid var(--line)}
#loud-design .song{font-size:18px;line-height:1.2;font-weight:700;margin-bottom:5px}
#loud-design .controls{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:14px}
#loud-design .controls button{min-width:48px;background:var(--soft);border:2px solid var(--line);border-radius:var(--round);display:grid;place-items:center}
#loud-design .controls .play{background:var(--yellow);min-width:72px}
#loud-design .track{height:5px;background:color-mix(in srgb,var(--ink) 18%,transparent);margin-top:16px}
#loud-design .track span{display:block;width:37%;height:100%;background:var(--ink)}
#loud-design .timebar{display:flex;justify-content:space-between;font:10px 'Space Mono',monospace;margin-top:7px}
#loud-design .days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;margin:14px -5px}
#loud-design .day{font:11px 'Space Mono',monospace;padding:7px 0}
#loud-design .day strong{display:block;font:700 17px 'Space Grotesk',sans-serif;margin-top:7px}
#loud-design .day.today{background:var(--yellow);outline:2px solid var(--line);border-radius:calc(var(--round) / 2)}
#loud-design .event{border-top:2px solid var(--line);padding-top:12px;display:flex;gap:12px;align-items:center}
#loud-design .eventtime{font:700 12px 'Space Mono',monospace;white-space:nowrap}
#loud-design .eventtitle{font-size:15px;font-weight:700}
#loud-design .notify{display:flex;align-items:center;gap:12px}
#loud-design .appicon{width:43px;height:43px;display:grid;place-items:center;background:var(--soft);border:2px solid var(--line);border-radius:calc(var(--round) / 2);font-weight:700;flex-shrink:0}
#loud-design .notify .copy{flex:1;min-width:0}
#loud-design .badge{background:var(--yellow);border:2px solid var(--line);min-width:29px;text-align:center;padding:4px;font:700 12px 'Space Mono',monospace;border-radius:calc(var(--round) / 2)}
#loud-design .devgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
#loud-design .devgrid button{display:flex;align-items:center;flex-direction:column;justify-content:center;gap:8px;background:transparent;border:0;padding:4px 0;font-size:10px}
#loud-design .bottom{color:var(--ink);display:flex;gap:8px;margin-top:22px;background:var(--soft);border:var(--border) solid var(--line);padding:6px;border-radius:var(--round);box-shadow:var(--shadow) var(--shadow) 0 var(--line)}
#loud-design .bottom button{flex:1;background:transparent;border:2px solid transparent;font-size:12px;font-weight:700;border-radius:calc(var(--round) / 1.4);display:flex;align-items:center;justify-content:center;gap:6px;padding:4px}
#loud-design .bottom button.active{background:var(--yellow);border-color:var(--line)}
#loud-design .phone button:active{transform:translate(3px,3px);box-shadow:none}
#loud-design .pagehead{font:800 36px 'Barlow Condensed',sans-serif;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
#loud-design .round .pagehead{font:700 29px 'Space Grotesk',sans-serif}
#loud-design .searchbox{color:var(--ink);display:flex;align-items:center;gap:9px;background:var(--soft);border:var(--border) solid var(--line);border-radius:var(--round);padding:10px;margin-bottom:20px}
#loud-design .searchbox input{width:100%;background:transparent;border:0;min-width:0;font-size:16px;min-height:30px}
#loud-design .appslist{display:flex;gap:10px}
#loud-design .rows{flex:1;min-width:0}
#loud-design .app-row{color:var(--ink);background:var(--soft);display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 10px;margin-bottom:12px;border:var(--border) solid var(--line);border-radius:var(--round);box-shadow:4px 4px 0 var(--line);font-size:15px;font-weight:700;overflow-wrap:anywhere}
#loud-design .square .app-row{text-transform:uppercase}
#loud-design .app-row.yellow{background:var(--yellow)}#loud-design .app-row.cyan{background:var(--cyan)}#loud-design .app-row.pink{background:var(--pink)}
#loud-design .letter{font:800 25px 'Barlow Condensed',sans-serif;display:flex;align-items:center;gap:10px;margin:12px 0 10px}
#loud-design .letter:after{content:'';height:2px;background:var(--line);flex:1}
#loud-design .rail{color:var(--ink);display:flex;flex-direction:column;align-self:flex-start;position:sticky;top:10px;border:2px solid var(--line);background:var(--yellow);border-radius:var(--round);width:34px;flex-shrink:0;text-align:center;padding:10px 0;font:11px/27px 'Space Mono',monospace}
#loud-design .setting{margin-bottom:19px}
#loud-design .setting>label{display:block;font-size:14px;font-weight:700;margin-bottom:8px}
#loud-design select{width:100%;background:var(--soft);border:2px solid var(--line);border-radius:calc(var(--round) / 2);padding:13px 8px;min-height:48px;font-size:14px}
#loud-design .swatches{display:flex;gap:7px;margin-top:10px}
#loud-design .swatches span{flex:1;height:37px;border:2px solid var(--line);border-radius:calc(var(--round) / 2)}
#loud-design .toggle{display:flex;justify-content:space-between;align-items:center;min-height:52px;gap:10px;font-size:14px}
#loud-design .toggle input{width:22px;height:22px;accent-color:var(--ink)}
#loud-design .settingnote{font-size:12px;line-height:1.6;margin:12px 0 0}
#loud-design .toast{background:var(--ink);color:var(--paper);padding:12px;margin-top:14px;border-radius:var(--round);font-size:12px;line-height:1.4}
#loud-design .empty{font-size:14px;padding:20px 0}
#loud-design .editrow{display:flex;gap:7px;margin-top:13px;flex-wrap:wrap}
#loud-design .editrow button{flex:1;min-width:60px;border:2px solid var(--line);background:var(--soft);font-size:12px;border-radius:calc(var(--round) / 2)}
#loud-design .edit-selected{outline:3px dashed var(--ink);outline-offset:5px;margin:7px}
#loud-design .dots-on{background-image:radial-gradient(color-mix(in srgb,var(--ink) 18%,transparent) .8px,transparent .8px);background-size:14px 14px}
#loud-design .statebox{font-size:13px;padding:12px;border:2px dashed var(--line);line-height:1.6}
#loud-design .controls button,#loud-design .tag,#loud-design .appicon,#loud-design .badge,#loud-design .day.today,#loud-design .bottom button.active{border-color:var(--ink);outline-color:var(--ink)}
@media(max-width:370px){#loud-design .phone{padding:14px 11px}#loud-design .tile{padding:12px}#loud-design .tiles{gap:12px}#loud-design .devgrid{gap:3px}#loud-design .app-row{font-size:13px;gap:8px}#loud-design .brand{font-size:29px}}
@media(prefers-reduced-motion:no-preference){#loud-design button{transition:transform 100ms,box-shadow 100ms}}
</style>
<div id="loud-design" class="viz-carousel viz-dotted-background" aria-label="Loud launcher design directions">
<section data-variant="Square Punch" aria-label="Square Punch launcher"><div class="loud-stage"><div class="phone square" data-shape="square"></div></div></section>
<section data-variant="Round Paper" aria-label="Round Paper launcher" hidden><div class="loud-stage"><div class="phone round" data-shape="round"></div></div></section>
</div>
<script>
(()=>{
const root=document.getElementById('loud-design');
const palettes={Taxi:['#f5f0e5','#171714','#ffe600','#00cbe5','#ff6395','#fffdf6','#171714'],Riso:['#fff5ec','#171714','#ff88b3','#8fbcff','#ffbb8a','#fffaf6','#171714'],Acid:['#f0f1df','#171714','#d1f555','#bba1ff','#ffa768','#fcffef','#171714'],'Night Brutal':['#202023','#171714','#e0fc67','#74dfed','#f3a4ce','#e8e5dc','#f0ede2'],Candy:['#fff2e8','#171714','#f8de8b','#b3dfe1','#f5b8c8','#fffaf3','#171714']};
const apps=[['C','Calendar','31'],['C','Camera','◎'],['C','ChatGPT','✳'],['C','Chrome','C'],['C','Claude','✳'],['G','GitHub','GH'],['M','Maps','M'],['S','Settings','⚙'],['S','Spotify','S'],['T','Teams','T'],['W','WhatsApp','W'],['Y','YouTube','▶']];
const icon=(name)=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
const tiles={clock:'Clock',weather:'Weather',note:'Sticky note',music:'Music',calendar:'Calendar',teams:'Teams',dev:'Dev shortcuts'};
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
root.querySelectorAll('.phone').forEach(phone=>{
const state={page:'live',palette:'Taxi',playing:true,dots:false,compact:false,scale:false,query:'',edit:false,selected:'music',tileState:'Content',order:Object.keys(tiles),hidden:new Set(),wide:new Set(),colour:{},month:9};
function colours(){const p=palettes[state.palette];['paper','ink','yellow','cyan','pink','soft','line'].forEach((k,i)=>phone.style.setProperty('--'+k,p[i]));phone.style.setProperty('--canvasink',state.palette==='Night Brutal'?'#f0ede2':p[1]);phone.classList.toggle('dots-on',state.dots);}
function tile(id,cls,html){if(state.hidden.has(id))return '';const colour=state.colour[id]||cls;return `<section class="tile ${colour} ${state.wide.has(id)?'':(['weather','note'].includes(id)?'half':'')} ${state.edit&&state.selected===id?'edit-selected':''}" data-tile="${id}">${html}${state.edit?`<div class="editrow"><button data-select="${id}">Edit ${tiles[id]}</button></div>`:''}</section>`;}
function home(){const content={
clock:tile('clock','yellow clocktile',`<div class="eyebrow"><span class="tag">LIVE / HAMILTON</span><span>↗</span></div><div class="clock">08:53</div><div class="date">TUESDAY, 13 OCTOBER</div><div class="clockfoot"><span>MAKE SOME NOISE.</span><span>ALARM 07:00</span></div>`),
weather:tile('weather','cyan',`<div class="eyebrow">WEATHER ${icon('sun')}</div><div class="weatherbig">18°</div><div class="sub"><b>Mostly sunny</b><br>H 20° · L 11°</div>`),
note:tile('note','pink',`<div class="eyebrow">NOTE ${icon('pencil')}</div><div class="note">Make something<br>worth opening.</div><div class="sub">One good thing today.</div>`),
music:tile('music','',`<div class="eyebrow"><span class="tag">NOW PLAYING</span><span>SPOTIFY</span></div><div class="music"><div class="record" aria-hidden="true"></div><div><div class="song">Everything In Its<br>Right Place</div><div class="sub">Radiohead · Kid A</div></div></div><div class="controls"><button data-action="previous" aria-label="Previous track">${icon('skip-back')}</button><button class="play" data-action="play" aria-label="${state.playing?'Pause':'Play'}">${icon(state.playing?'pause':'play')}</button><button data-action="next" aria-label="Next track">${icon('skip-forward')}</button></div>${state.wide.has('music')?'':'<div class="track"><span></span></div><div class="timebar"><span>1:32</span><span>4:11</span></div>'}`),
calendar:tile('calendar','',`<div class="eyebrow"><span class="tag">CALENDAR</span><span>OCT 2026</span></div><div class="days">${['M','T','W','T','F','S','S'].map((x,i)=>`<div class="day ${i===1?'today':''}">${x}<strong>${12+i}</strong></div>`).join('')}</div><div class="event"><div class="eventtime">10:30</div><div><div class="eventtitle">Design catch-up</div><div class="sub">30 min · Teams meeting</div></div></div>`),
teams:tile('teams','cyan',`<div class="notify"><div class="appicon">T</div><div class="copy"><div class="eventtitle">TEAMS</div><div class="sub">${state.compact?'2 notifications':'2 notifications · Project chat'}</div>${state.compact?'':'<div class="sub">“Ready when you are.”</div>'}</div><span class="badge">2</span></div>`),
dev:tile('dev','yellow',`<div class="eyebrow">DEV DESK <span>↗</span></div><div class="devgrid">${[['✳','Claude'],['✺','ChatGPT'],['GH','GitHub'],['▲','Vercel']].map(([x,n])=>`<button data-open="${n}"><span class="appicon">${x}</span><span>${n}</span></button>`).join('')}</div>`)};
return `<div class="tiles">${state.order.map(id=>content[id]).join('')}</div>`;}
function list(){const filtered=apps.filter(x=>x[1].toLowerCase().includes(state.query.toLowerCase()));let last='';return `<div class="pagehead">APPS <span class="tag">${filtered.length} ITEMS</span></div><label class="searchbox">${icon('search')}<input aria-label="Search apps" placeholder="Find an app…" value="${esc(state.query)}"></label><div class="appslist"><div class="rows">${filtered.map(([l,n,s],i)=>{const head=last!==l?`<div class="letter">${l}</div>`:'';last=l;return head+`<button class="app-row ${['','yellow','pink','cyan'][i%4]}" data-open="${n}"><span class="appicon">${s}</span>${n}</button>`;}).join('')||'<div class="empty">No matching apps.</div>'}</div><div class="rail" aria-label="Alphabet index, visual preview">${'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').join('<br>')}</div></div>`;}
function settings(){return `<div class="pagehead">MAKE IT YOURS</div><div class="tile"><div class="setting"><label>Colour palette</label><select data-setting="palette">${Object.keys(palettes).map(x=>`<option ${state.palette===x?'selected':''}>${x}</option>`).join('')}</select><div class="swatches">${palettes[state.palette].slice(2,6).map(c=>`<span style="background:${c}"></span>`).join('')}</div></div><label class="toggle">Dot-grid decoration<input type="checkbox" data-setting="dots" ${state.dots?'checked':''}></label><label class="toggle">Compact notification tile<input type="checkbox" data-setting="compact" ${state.compact?'checked':''}></label><div class="settingnote">Background follows the palette. Optional wallpaper will be available in the wired launcher.</div></div><div class="tile" style="margin-top:20px"><div class="eyebrow">POWER BUBBLE</div><div class="notify"><button class="smallbtn" data-action="power" aria-label="Preview Power Bubble">${icon('power')}</button><div><div class="eventtitle">Neubrutal</div><div class="sub">Matching ink, fill and hard shadow</div></div></div></div><div class="tile" style="margin-top:20px"><div class="eyebrow">TILE STATES</div><select data-setting="tileState">${['Content','Loading','Empty','Offline','Permission needed'].map(x=>`<option ${x===state.tileState?'selected':''}>${x}</option>`).join('')}</select><div class="statebox" style="margin-top:12px">${{'Content':'18° · Mostly sunny · Hamilton','Loading':'WEATHER / Loading forecast…','Empty':'CALENDAR / Nothing scheduled. A little breathing room.','Offline':'18° · Saved forecast · Updated 2 hours ago','Permission needed':'CALENDAR / Allow calendar access to see your day.'}[state.tileState]}</div></div><button class="smallbtn" style="width:100%;margin-top:20px" data-action="edit">Edit home layout</button>`;}
function editPanel(){return `<div class="tile" style="margin-bottom:20px"><div class="eyebrow">EDIT / ${tiles[state.selected].toUpperCase()}</div><div class="editrow"><button data-action="move">Move up</button><button data-action="resize">Resize</button><button data-action="colour">Colour</button><button data-action="remove">Remove</button></div><div class="editrow"><button data-action="restore">Restore tiles</button><button data-action="done">Done</button></div></div>`;}
function render(focus=false){colours();phone.innerHTML=`<div class="status"><span>8:53</span><span>◒ ▰ 87%</span></div><div class="top"><span class="brand">LOUD<span>✳</span></span><span class="sample">DESIGN PREVIEW</span><button class="smallbtn" data-nav="settings" aria-label="Appearance settings">${icon('sliders-horizontal')}</button></div>${state.edit?editPanel():''}<main>${state.page==='apps'?list():state.page==='settings'?settings():home()}</main><nav class="bottom" aria-label="Launcher pages"><button class="${state.page==='live'?'active':''}" data-nav="live">${icon('layout-dashboard')} LIVE</button><button class="${state.page==='apps'?'active':''}" data-nav="apps">${icon('grid-2x2')} APPS</button><button data-nav="search">${icon('search')} SEARCH</button></nav><div class="feedback" aria-live="polite"></div>`;if(globalThis.lucide)lucide.createIcons();if(focus){const input=phone.querySelector('input[aria-label="Search apps"]');input?.focus();input?.setSelectionRange(state.query.length,state.query.length);}}
phone.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.nav){state.edit=false;state.page=b.dataset.nav==='search'?'apps':b.dataset.nav;render(b.dataset.nav==='search');return;}if(b.dataset.open){phone.querySelector('.feedback').innerHTML=`<div class="toast">${esc(b.dataset.open)} would open on your phone. Sample apps in this preview.</div>`;return;}if(b.dataset.select){state.selected=b.dataset.select;render();return;}const a=b.dataset.action;if(a==='play'){state.playing=!state.playing;render();}else if(a==='edit'){state.page='live';state.edit=true;render();}else if(a==='done'){state.edit=false;render();}else if(a==='move'){const i=state.order.indexOf(state.selected);if(i>0)[state.order[i-1],state.order[i]]=[state.order[i],state.order[i-1]];render();}else if(a==='resize'){state.wide.has(state.selected)?state.wide.delete(state.selected):state.wide.add(state.selected);if(!['weather','note'].includes(state.selected))state.compact=!state.compact;render();}else if(a==='colour'){const arr=['yellow','cyan','pink',''];state.colour[state.selected]=arr[(arr.indexOf(state.colour[state.selected]||'')+1)%4];render();}else if(a==='remove'){state.hidden.add(state.selected);render();}else if(a==='restore'){state.hidden.clear();state.order=Object.keys(tiles);state.wide.clear();state.colour={};render();}else if(a){phone.querySelector('.feedback').innerHTML=`<div class="toast">${a==='power'?'Power Bubble appearance preview; device locking is disabled here.':'Media action preview. No live session connected.'}</div>`;}});
phone.addEventListener('input',e=>{if(e.target.matches('input[aria-label="Search apps"]')){state.query=e.target.value;render(true);}});
phone.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('input[aria-label="Search apps"]')){const first=phone.querySelector('.app-row');if(first)first.click();else phone.querySelector('.feedback').innerHTML='<div class="toast">Chrome would search for “'+esc(state.query)+'”.</div>';}});
phone.addEventListener('change',e=>{const k=e.target.dataset.setting;if(k){state[k]=e.target.type==='checkbox'?e.target.checked:e.target.value;render();}});
render();
});
})();
</script>
<script>document.querySelectorAll('[data-direction]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-variant]').forEach(s=>s.hidden=s.dataset.variant!==b.dataset.direction);document.querySelectorAll('[data-direction]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));}));</script></html>
